[project]
name = "speaker-scribe"
version = "0.1.0"
description = "Local-first audio transcription and speaker diarization web app for Apple Silicon."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.124.0",
  "pydantic>=2.12.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
ml = [
  # MLX Whisper transcription plus a fully local, account-free diarization stack:
  # Silero VAD for speech regions, SpeechBrain ECAPA embeddings, scikit-learn clustering.
  "mlx-whisper>=0.4.3; python_version < '3.14'",
  # mlx-whisper leaves numba unpinned. Without a floor the resolver keeps the newest
  # numpy and backtracks numba to 0.53.1, whose llvmlite refuses to build on Python
  # >=3.10. Pinning numba forces numpy down to a version numba actually supports.
  "numba>=0.61; python_version < '3.14'",
  "silero-vad>=5.1; python_version < '3.14'",
  "speechbrain>=1.0.2; python_version < '3.14'",
  "scikit-learn>=1.5; python_version < '3.14'",
  # Used directly by catalog.py to read and manage the model cache. It arrives
  # transitively too, but relying on that leaves the dependency undeclared.
  "huggingface-hub>=0.30; python_version < '3.14'",
  # Security floors on packages we only get transitively.
  #
  # torch < 2.10 carries PYSEC-2026-2286: a crafted checkpoint can corrupt memory
  # through the `weights_only` unpickler, up to arbitrary code execution. That is
  # not theoretical here -- SpeechBrain calls torch.load on downloaded ECAPA
  # weights on every diarization run. Seven further advisories against 2.8.0 are
  # memory corruption in ops this app never calls, and are fixed by the same bump.
  "torch>=2.10; python_version < '3.14'",
  "torchaudio>=2.10; python_version < '3.14'",
  # setuptools < 83 fails to normalize Unicode when applying MANIFEST.in excludes,
  # so an NFD filename can slip past an NFC exclude rule into a published sdist.
  "setuptools>=83; python_version < '3.14'",
]
test = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/speaker_scribe_backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
