[project]
name = "speaker-scribe"
version = "0.1.0"
description = "Local-first audio transcription and speaker diarization web app for Apple Silicon."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.124.0",
  "pydantic>=2.12.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
ml = [
  "whispermlx==3.12.2; python_version < '3.14'",
]
test = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/speaker_scribe_backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
