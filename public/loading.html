<!doctype html>
<!--
  Shown while the local server starts.

  The window used to stay hidden until the server answered, which on a cold
  start reads as the app having failed to launch. Opening on this page instead
  means something appears immediately, and it is also where a startup failure is
  reported: the shell writes into #detail rather than raising a system dialog
  with no window behind it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speaker Scribe</title>
    <style>
      :root {
        --page: #f6f7f4;
        --text: #17211f;
        --muted: #66736f;
        --line: #dce3df;
        --teal: #0f766e;
        --red: #b42318;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      .mark {
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto 1.25rem;
        border: 2px solid var(--line);
        border-top-color: var(--teal);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .mark { animation-duration: 3s; }
      }
      h1 { margin: 0 0 0.5rem; font-size: 1rem; font-weight: 600; }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
        white-space: pre-wrap;
      }
      body.failed .mark {
        animation: none;
        border-color: var(--red);
        border-radius: 4px;
      }
      body.failed p { color: var(--red); text-align: left; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1 id="title">Starting Speaker Scribe</h1>
      <p id="detail">Loading the speech engine. The first launch takes a moment.</p>
    </main>
  </body>
</html>
